<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34" fill="none">
  <defs>
    <linearGradient id="favBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="favFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="favShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Back Card (Deep Forest Pine with Mint Outline) -->
  <rect x="7" y="4.5" width="23.5" height="17" rx="3.5" fill="url(#favBackGrad)" stroke="#34D399" stroke-width="1.8" />
  <line x1="7" y1="8.5" x2="30.5" y2="8.5" stroke="#022C22" stroke-width="2" />

  <!-- Front Card (Luminous Emerald & Jade Mint with White Border) -->
  <g filter="url(#favShadow)">
    <rect x="2.5" y="9.5" width="25.5" height="18.5" rx="3.5" fill="url(#favFrontGrad)" stroke="#FFFFFF" stroke-width="1.8" />
    
    <!-- Magnetic Stripe -->
    <rect x="2.5" y="13.5" width="25.5" height="3" fill="#047857" />
    
    <!-- Golden EMV Chip -->
    <rect x="5.5" y="19" width="6.5" height="5" rx="1" fill="#FBBF24" stroke="#B45309" stroke-width="0.5" />
    <line x1="8.75" y1="19" x2="8.75" y2="24" stroke="#B45309" stroke-width="0.5" />
    <line x1="5.5" y1="21.5" x2="12" y2="21.5" stroke="#B45309" stroke-width="0.5" />

    <!-- Wave Contactless Indicator -->
    <path d="M19 19.5 A 3 3 0 0 1 19 23.5" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M21 18.5 A 5 5 0 0 1 21 24.5" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.9" />
  </g>
</svg>
